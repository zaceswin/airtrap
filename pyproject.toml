[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airtrap"
version = "0.1.0"
description = "Layer 2 Wi-Fi honeypot and wireless intrusion detection system with JSON logging"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["scapy>=2.5", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
airtrap = "airtrap.cli:main"

[tool.setuptools]
packages = ["airtrap"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
